<footer class="minimal">
  <template vb-if="contact">
    <address class="footer">
      <template vb-each="contact" vb-as="line">
        <p>{{line}}</p>
      </template>
    </address>
  </template>
  <site-legal>
    <span>{{copyright}}</span>
    <template vb-if="legal">
      <template vb-each="legal" vb-as="link">
        <a href="{{link.href}}">{{link.text}}</a>
      </template>
    </template>
  </site-legal>
  <template vb-if="links">
    <nav aria-label="{{label}}">
      <ul>
        <template vb-each="links" vb-as="link">
          <li><a href="{{link.href}}">{{link.text}}</a></li>
        </template>
      </ul>
    </nav>
  </template>
</footer>
