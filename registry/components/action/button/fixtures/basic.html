<button type="button" commandfor="terms" command="show-modal">Read the terms</button>
<dialog id="terms" aria-labelledby="terms-title">
  <header>
    <h2 id="terms-title">Terms of service</h2>
    <button type="button" class="ghost" commandfor="terms" command="close" aria-label="Close dialog"><icon-wc name="x"></icon-wc></button>

    <p>Be kind.</p>
  </section>
