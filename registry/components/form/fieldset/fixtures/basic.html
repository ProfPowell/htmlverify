<fieldset>
  <legend>Delivery address</legend>
  <layout-stack data-layout-gap="m">
    <form-field>
      <label for="basic-street-input">Street</label>
      <input id="basic-street-input" type="text" name="street" autocomplete="street-address" required="true" />
    </form-field>
    <form-field>
      <label for="basic-postcode-input">Postcode</label>
      <input id="basic-postcode-input" type="text" name="postcode" autocomplete="postal-code" required="true" />
    </form-field>
  </layout-stack>
</fieldset>
