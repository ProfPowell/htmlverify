<form-field>
  <label for="full-input">Documents</label>
  <input id="full-input" type="file" name="documents" multiple="true" required="true" aria-describedby="full-hint full-error" />
  <output id="full-hint" class="hint" for="full-input">PDFs, up to 10 MB each.</output>
  <output id="full-error" class="error" for="full-input">Attach at least one document.</output>
</form-field>
