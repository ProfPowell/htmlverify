<form-field>
  <label for="full-input">Plan</label>
  <select id="full-input" name="plan" required="true" aria-describedby="full-hint full-error">
    <option value="">Pick a plan</option>
    <option value="starter">Starter</option>
  </select>
  <output id="full-hint" class="hint" for="full-input">You can change it later.</output>
  <output id="full-error" class="error" for="full-input">Choose a plan.</output>
</form-field>
