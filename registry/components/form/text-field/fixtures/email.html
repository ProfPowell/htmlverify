<form-field>
  <label for="email-input">Email</label>
  <input id="email-input" type="email" name="email" autocomplete="email" required="true" aria-describedby="email-hint email-error" />
  <output id="email-hint" class="hint" for="email-input">We <em>never</em> share it.</output>
  <output id="email-error" class="error" for="email-input">Enter an email address, such as name@example.org.</output>
</form-field>
