<form action="/profile" method="post" enctype="multipart/form-data" class="stacked">
  <form-field>
    <label for="upload-photo-input">Profile photo</label>
    <input id="upload-photo-input" type="file" name="photo" accept="image/*" />
  </form-field>
  <footer class="actions end"><button type="submit">Save</button></footer>
</form>
