<fieldset aria-describedby="hint-hint">
  <legend>Sizes</legend>
  <output id="hint-hint" class="hint">Choose all that fit.</output>
  <layout-stack data-layout-gap="xs">
    <form-field data-type="checkbox"><label><input type="checkbox" name="sizes" value="s" /> Small</label></form-field>
    <form-field data-type="checkbox"><label><input type="checkbox" name="sizes" value="m" /> Medium</label></form-field>
    <form-field data-type="checkbox"><label><input type="checkbox" name="sizes" value="l" /> Large</label></form-field>
  </layout-stack>
</fieldset>
