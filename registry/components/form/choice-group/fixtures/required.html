<fieldset aria-describedby="required-hint">
  <legend>Delivery</legend>
  <output id="required-hint" class="hint">Next-day delivery costs £5.</output>
  <layout-stack data-layout-gap="xs">
    <form-field data-type="radio"><label><input type="radio" name="delivery" value="standard" required="true" /> Standard, 3 to 5 days</label></form-field>
    <form-field data-type="radio"><label><input type="radio" name="delivery" value="next-day" required="true" /> Next day</label></form-field>
    <form-field data-type="radio"><label><input type="radio" name="delivery" value="collect" required="true" /> Collect from the shop</label></form-field>
  </layout-stack>
</fieldset>
