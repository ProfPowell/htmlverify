<form-field>
  <label for="full-input">Guests</label>
  <input id="full-input" type="number" name="guests" min="1" max="8" step="1" value="2" required="true" aria-describedby="full-hint full-error" />
  <output id="full-hint" class="hint" for="full-input">Up to 8 per booking.</output>
  <output id="full-error" class="error" for="full-input">Choose 1 to 8 guests.</output>
</form-field>
