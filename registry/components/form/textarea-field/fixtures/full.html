<form-field>
  <label for="full-input">Describe the problem</label>
  <textarea id="full-input" name="details" rows="8" maxlength="2000" required="true" aria-describedby="full-hint full-error"></textarea>
  <output id="full-hint" class="hint" for="full-input">Include what you expected and what happened.</output>
  <output id="full-error" class="error" for="full-input">Tell us what went wrong.</output>
</form-field>
