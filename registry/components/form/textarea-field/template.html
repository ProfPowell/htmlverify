<form-field>
  <label for="@input">{{label}}</label>
  <textarea id="@input" name="{{name}}" rows="{{rows}}" maxlength="{{maxLength}}" required="{{required}}" aria-describedby="@hint @error"></textarea>
  <template vb-if="hint">
    <output id="@hint" class="hint" for="@input">{{hint}}</output>
  </template>
  <template vb-if="error">
    <output id="@error" class="error" for="@input">{{error}}</output>
  </template>
</form-field>
