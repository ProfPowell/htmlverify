<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Annual report: membership numbers</title>
  <link rel="stylesheet" href="/vb/vanilla-breeze.css"/>
  <script src="/vb/vanilla-breeze.js" defer="defer"></script>
  <style>
    td:not(:first-child), th:not(:first-child) { text-align: end; font-variant-numeric: tabular-nums; }
    figure { overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Annual report: membership numbers</h1>
    <p>Larkspur Supply Co. 2025 membership report.</p>
  </header>

  <main id="main" data-layout="stack">
    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">Summary</h2>
      <p>Membership grew 11% in 2025, to 9,400 members. Rentals grew fastest.</p>
    </section>

    <section aria-labelledby="table-heading">
      <h2 id="table-heading">Members and activity by quarter</h2>
      <figure>
        <table>
          <caption>Members and activity by quarter, 2025</caption>
          <thead>
            <tr>
              <th scope="col">Quarter</th>
              <th scope="col">New members</th>
              <th scope="col">Total members</th>
              <th scope="col">Rentals</th>
              <th scope="col">Repairs</th>
            </tr>
          </thead>
          <tbody>
            <tr><th scope="row">Q1</th><td>210</td><td>8,680</td><td>1,140</td><td>640</td></tr>
            <tr><th scope="row">Q2</th><td>390</td><td>9,070</td><td>2,310</td><td>820</td></tr>
            <tr><th scope="row">Q3</th><td>260</td><td>9,330</td><td>2,950</td><td>910</td></tr>
            <tr><th scope="row">Q4</th><td>70</td><td>9,400</td><td>980</td><td>730</td></tr>
          </tbody>
          <tfoot>
            <tr><th scope="row">Total</th><td>930</td><td>9,400</td><td>7,380</td><td>3,100</td></tr>
          </tfoot>
        </table>
        <figcaption>Totals for members are year-end figures.</figcaption>
      </figure>
    </section>

    <section aria-labelledby="download-heading">
      <h2 id="download-heading">Download</h2>
      <p><a href="/reports/2025.pdf" download="download">The full report as PDF</a> (PDF, 2.4 MB)</p>
    </section>
  </main>
</body>
</html>
