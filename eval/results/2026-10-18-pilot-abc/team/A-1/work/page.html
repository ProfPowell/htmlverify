<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Team - Larkspur Supply Co.</title>
  <link rel="stylesheet" href="/vb/vanilla-breeze.css"/>
  <script src="/vb/vanilla-breeze.js"></script>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="#main">Skip to content</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <article>
      <hgroup>
        <h1>Team</h1>
        <p>Meet the Larkspur Supply Co. team.</p>
      </hgroup>

      <section aria-labelledby="people-heading">
        <h2 id="people-heading">People</h2>
        <ul data-layout="grid">
          <li>
            <figure>
              <img src="priya-raman.jpg" alt="Photo of Priya Raman"/>
              <figcaption>
                <h3>Priya Raman</h3>
                <p><strong>General manager</strong></p>
                <p>Twenty years of guiding sea-kayak trips before she ran the store.</p>
              </figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="ines-okafor.jpg" alt="Photo of Ines Okafor"/>
              <figcaption>
                <h3>Ines Okafor</h3>
                <p><strong>Board chair</strong></p>
                <p>A member since 1994 and a former ranger.</p>
              </figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="theo-lindqvist.jpg" alt="Photo of Theo Lindqvist"/>
              <figcaption>
                <h3>Theo Lindqvist</h3>
                <p><strong>Repair lead</strong></p>
                <p>Fixes zippers, stoves, and once, a canoe.</p>
              </figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="dana-brooks.jpg" alt="Photo of Dana Brooks"/>
              <figcaption>
                <h3>Dana Brooks</h3>
                <p><strong>Rental manager</strong></p>
                <p>Knows where every kayak is, right now.</p>
              </figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="sam-whitlock.jpg" alt="Photo of Sam Whitlock"/>
              <figcaption>
                <h3>Sam Whitlock</h3>
                <p><strong>Communications</strong></p>
                <p>Writes the newsletter and the trail reports.</p>
              </figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="marta-ellison.jpg" alt="Photo of Marta Ellison"/>
              <figcaption>
                <h3>Marta Ellison</h3>
                <p><strong>Workshop coordinator</strong></p>
                <p>Teaches the knots class.</p>
              </figcaption>
            </figure>
          </li>
        </ul>
      </section>

      <aside aria-labelledby="join-heading">
        <h2 id="join-heading">Join us</h2>
        <p>We're hiring a seasonal <a href="/jobs/rental-assistant">rental assistant</a>.</p>
      </aside>
    </article>
  </main>
</body>
</html>
